    Properties:
      QueueName: 'OSFileProcessingQueue'
      VisibilityTimeout: 60 

  SQSQueuePolicy:
    Type: 'AWS::SQS::QueuePolicy'
    Properties:
      Queues:
        - !Ref OSFileProcessingQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 'lambda.amazonaws.com'
            Action:
              - 'sqs:SendMessage'
              - 'sqs:ReceiveMessage'
              - 'sqs:DeleteMessage'
              - 'sqs:GetQueueAttributes'
            Resource: !GetAtt OSFileProcessingQueue.Arn

  SQSLambdaEventSourceMapping:
    Type: 'AWS::Lambda::EventSourceMapping'
    Properties:
      BatchSize: 10
      EventSourceArn: !GetAtt OSFileProcessingQueue.Arn
      FunctionName: !GetAtt ImageProcessingLambda.Arn
      Enabled: True

  FileUploadLambda:
    Type: 'AWS::Lambda::Function'
    Properties:
      FunctionName: 'file-upload2'
      Handler: 'index.lambda_handler'
      Role: 'arn:aws:iam::211125789396:role/LabRole'
      Runtime: 'python3.9'
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import base64
          import boto3
          import os

          s3 = boto3.client('s3')
          sqs = boto3.client('sqs')

          BUCKET_NAME = os.environ['BUCKET_NAME']
          SQS_QUEUE_URL = os.environ['SQS_QUEUE_URL']

          def lambda_handler(event, context):
              try:
                  print("Event:", event)
                  body = json.loads(event['body'])
                  image_data = body['image']
                  file_name = body['filename']

                  # Upload file to S3
                  image_data_bytes = base64.b64decode(image_data)
                  s3.put_object(Bucket=BUCKET_NAME, Key=file_name, Body=image_data_bytes, ContentType='image/jpeg')

                  # Send message to SQS
                  message = {
                      'bucket_name': BUCKET_NAME,
                      'file_name': file_name
                  }
                  sqs.send_message(QueueUrl=SQS_QUEUE_URL, MessageBody=json.dumps(message))

                  return {
                      'statusCode': 200,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          'Access-Control-Allow-Methods': 'POST,OPTIONS',
                          'Access-Control-Allow-Headers': 'Content-Type'
                      },
                      'body': json.dumps({'message': 'File uploaded successfully and message sent to SQS'})
                  }
              except Exception as e:
                  print(f"Error uploading file: {e}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'message': 'File upload failed', 'error': str(e)})
                  }
      Environment:
        Variables:
          BUCKET_NAME: !Ref StorageOceanBucket
          SQS_QUEUE_URL: !GetAtt OSFileProcessingQueue.QueueUrl

